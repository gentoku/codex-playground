name: Verify Gravity Lab in Chromium
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview > /tmp/gravity-preview.log 2>&1 &
          node --input-type=module <<'JS'
          const url = 'http://localhost:4173/codex-playground/';
          for (let attempt = 0; attempt < 60; attempt++) {
            try { if ((await fetch(url)).ok) process.exit(0); } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          throw new Error('Preview server did not start');
          JS
      - run: npm run test:browser
        env:
          APP_URL: http://localhost:4173/codex-playground/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravity-lab-browser-screenshots
          path: work/*.png
          if-no-files-found: ignore
